name: Mutation trial (Linux)

# One trial of the vendor mutation tool (mutmut, which does not run on Windows) on the delete-side modules (ADOPT section 9, row L3a).
# Never on every push: it starts by hand (Actions tab, "Run workflow") or when a commit changes this file or its requirements.
# Not one of the checks a merge waits for. The result is read from the job log and written into docs/slices/L6-the-delete-side.md.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mutation-trial.yml"
      - ".github/mutation/**"

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut on the delete modules · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The mutants the trial asks for (names are module.x_function__mutmut_N): all of retention.py, the schema check of db.py, the masker of export.py.
      MUTANTS: >-
        leadforge.retention.*
        leadforge.db.x_check_schema_before_write__mutmut_*
        leadforge.db.x_peek_schema_version__mutmut_*
        leadforge.db.x__version_of__mutmut_*
        leadforge.db.x_schema_gaps__mutmut_*
        leadforge.export.x__masker__mutmut_*
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Everything from hashed files; the tool lives only in this job (mutmut 3.8.1, 2026-10-28, publisher boxed / Anders Hovmöller).
      - name: Install (hashed lock, hashed mutation requirements, then the package without dependency resolution)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes -r .github/mutation/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: The tests pass unmutated (a red suite would make every mutant look killed)
        run: python -m pytest tests/test_l6_forget.py tests/test_l6_forget_held.py tests/test_l6_purge.py tests/test_l6_purge_files.py tests/test_l6_schema_first.py tests/test_l6_suppressed_export.py

      - name: mutmut run
        shell: bash
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          set -f; mutmut run $MUTANTS 2>&1 | tee mutmut-run.out; set +f

      - name: Result per module, and the survivors
        if: always()
        shell: bash
        run: |
          set -f
          mutmut results --all true > mutmut-results.txt || true
          # shellcheck disable=SC2086
          python .github/mutation/summarize.py mutmut-results.txt $MUTANTS | tee -a "$GITHUB_STEP_SUMMARY"
