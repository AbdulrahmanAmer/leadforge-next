name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only token, no secrets; CI never deploys (blueprint 2.2).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (editable, dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # One command, same as the laptop: versions, frontmatter, lint, the offline suite, the digest contract.
      - name: node check.mjs --ci
        run: node check.mjs --ci

      - name: Non-editable install works
        shell: bash
        run: |
          python -m pip uninstall -y leadforge
          python -m pip install .
          python -m leadforge version
          # the packaged rubric must ship in the wheel — score once crashed here (repo-relative path)
          python -c "from importlib.resources import files; t=(files('leadforge')/'data'/'scoring.default.yaml').read_text(encoding='utf-8'); assert 'factors' in t"

  # Both systems: the guard refuses a DNS question to a loopback stub resolver too (port 53 is never local), so Linux
  # logs the same refused list as the Windows-made saved result (docs/slices/L5-...md).
  e2e-fake-campaign:
    name: fake campaign · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The way the plugin launcher and install.py do it: the hashed lock, then the package without its own dependency resolution.
      - name: Install (hashed lock, then editable without deps)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      # An invented campaign through the CLI, every outside call refused; compared with tests/fixtures/e2e/expected.json.
      # The script exits 1 on FAIL; the grep makes a printed FAIL fail the job even if that ever changes.
      - name: Run the fake campaign
        shell: bash
        run: |
          python scripts/e2e_fake_campaign.py | tee e2e.out
          if grep -E '^FAIL' e2e.out; then exit 1; fi

  versions:
    name: Version strings agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pyproject == __init__ == plugin manifests == both skills (== pushed tag)
        run: python .github/scripts/check_versions.py

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: claude plugin validate .

  manifests:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: JSON is well-formed
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            echo "checking $f"
            python -c "import json,sys; json.load(open('$f'))"
          done
      - name: Skill frontmatter is portable (spec fields only)
        run: python .github/scripts/check_skill_frontmatter.py
