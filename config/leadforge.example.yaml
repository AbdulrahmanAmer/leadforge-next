# LeadForge workspace configuration.
# Copy to ./leadforge.yaml next to where you run `leadforge` and edit what you need.
# Everything here is optional — these ARE the defaults (env overrides: LEADFORGE_SECTION__KEY=value).

data_dir: leadforge_data          # all state (db, cache, exports, logs, bin) lives here; gitignored
progress_window: true             # headless runs pop a console with the live progress bar (Windows); set false or LEADFORGE_NO_UI=1 to disable
default_region: US                # ISO2 fallback for phone parsing when a listing has no country

discovery:
  providers: [dvsa]               # dvsa | companies_house, or a name an installed add-on provides; order matters
  grid_mode: "off"                # off | auto  (tiled queries; only a provider that supports tiles uses it)
  grid_cell_km: 3.0

crawl:
  pages_per_site: 6
  headed_browser: false           # true = browser escalation opens a VISIBLE browser window (debug; renders sites that refuse plain HTTP). No stealth flags ever (icm/SCOPE.md)
  timeout_s: 15
  max_text_bytes: 400000
  decode_protected_emails: false  # true = decode Cloudflare "[email protected]" spans; off by default (an anti-harvesting measure)

enrich:                            # crawl-time enrichment throughput/quality knobs (Layer 3)
  ner: true                        # GLiNER zero-shot people extraction; false = heuristic extractor only
  ner_device: auto                 # auto | cpu | cuda — auto picks cuda when torch.cuda.is_available()
  ner_batch: 8                     # requests the model worker groups into one GLiNER call
  ner_batch_wait_ms: 25.0          # max wait to fill a batch before running it short
  ner_timeout_s: 30.0              # per-request timeout incl. queue wait; on expiry a crawl thread falls back to heuristics
  ner_parallel: 2                  # legacy in-thread NER fallback only (worker unavailable): inferences in flight
  ner_threads: 2                   # legacy in-thread NER fallback only: torch intra-op threads per inference

politeness:
  delay_s: 2.0                    # per-host, +/-30% jitter; 1 request in flight per host
  workers: 24                     # different hosts crawled in parallel (per-host pacing unchanged)
  user_agent: "LeadForgeBot/0.1 (internal lead research)"

validation:
  dns_timeout_s: 5.0
  staleness_days: 90

registry:                         # the keys are NOT set here (refused): environment LEADFORGE_REGISTRY__<NAME> or the OS keyring
  # LEADFORGE_REGISTRY__COMPANIES_HOUSE_KEY / LEADFORGE_REGISTRY__OPENCORPORATES_TOKEN, or `keyring set leadforge registry.<name>`
  # companies_house_url: only the default address or a loopback one is accepted (the key goes with every request)
  keyring: true                   # look in the OS keyring when the environment has no key (extra `keyring`)
  opencorporates_enabled: false   # its API takes the token only in the web address, so it is off unless you switch it on

agent:                             # v0.4 headless agent runner (ADR-015): your own Claude Code, no API key
  command: null                    # null = auto-detect `claude` on PATH; [] = disabled (deterministic fallbacks only)
  model: sonnet                    # used only for the auto-detected command
  timeout_s: 900                   # per invocation; process tree is killed on timeout
  batch: 40                        # items per invocation
  max_batches: 50                  # hard stop per stage per run
  isolate: true                    # auto-detected command only: add --strict-mcp-config + disable hooks (~3x faster, no operator MCP/hook noise); ignored when `command` is set explicitly
  max_concurrent: 2                # process-level cap on simultaneous `claude` invocations

retention:
  months: 12                      # a business and everything attached to it expires this many months after the run that first found it (1 to 12: shorten only)

export:
  formats: [xlsx, csv]
  auto_open: true                 # open the finished XLSX automatically (skipped in CI / LEADFORGE_NO_UI)
